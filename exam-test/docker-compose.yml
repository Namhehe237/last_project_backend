version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: online_exam_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dnp220598
      MYSQL_DATABASE: online_exam_platform
      MYSQL_USER: exam_user
      MYSQL_PASSWORD: exam_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database_setup.sql:/docker-entrypoint-initdb.d/01-setup.sql
      - ./mysql_config:/etc/mysql/conf.d
    networks:
      - exam_network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: online_exam_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - exam_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  exam_network:
    driver: bridge 