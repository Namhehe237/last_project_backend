jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 1 day

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dp7uw6pv6}
  api-key: ${CLOUDINARY_API_KEY:164652653745153}
  api-secret: ${CLOUDINARY_API_SECRET:lQyc5Ixz99LwjrCYhJovA_un60c}

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/online_exam_platform?useSSL=true&requireSSL=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC
  security:
    user:
      name: admin
      password: admin
      roles: ADMIN
  jpa:
    hibernate:
      ddl-auto: update # create | update | validate | none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  # Redis Configuration
  # eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhZG1pbkBnbWFpbC5jb20iLCJpYXQiOjE3NjMzMDM3MzcsImV4cCI6MTc2MzM5MDEzN30.kCoK9bGjjdprxuaRi9SG-efcbNY1s8pRmS-VRvT8tiM
  data:
    redis:
      # host: ${REDIS_HOST:localhost}
      # port: ${REDIS_PORT:6379}
      # password: ${REDIS_PASSWORD:}
      # timeout: 2000ms
      host: localhost
      port: 6379
      ssl:
        enabled: true
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 minutes
      cache-null-values: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
      file-size-threshold: 2KB

server:
  port: ${PORT:8080}

logging:
  level:
    io.lettuce.core: DEBUG
    org.springframework.data.redis: DEBUG
    io.netty: DEBUG
